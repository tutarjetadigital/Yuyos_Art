        html, body {

            padding: 0;
            min-height: 100vh;

            position: fixed;

            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 1;
        }

        main {

            z-index: 10;
        }

        .banner-clip {
            clip-path: polygon(0 0, 100% 0, 100% 85%, 0 100%);
        }

        /* Botones de enlaces */
        .icon-link {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            background: rgba(22, 30, 46, 0.65);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);

        .icon-link:hover {

            background: rgba(35, 48, 71, 0.85);
            border-color: rgba(168, 85, 247, 0.4);
            box-shadow: 0 8px 20px -4px rgba(168, 85, 247, 0.25);

        #dynamicBannerCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }
    </style>

        <span>¡Enlace copiado!</span>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            // Canvas de burbujas en el fondo global
            const canvas = document.getElementById('bubbleCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');

            let width = canvas.width = window.innerWidth;
            let height = canvas.height = window.innerHeight;

            window.addEventListener('resize', () => {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            });

            const bubbles = [];
            const numBubbles = 30;

            function createBubble(initial = false) {
                return {
                    x: Math.random() * width,
                    y: initial ? Math.random() * height : height + Math.random() * 30 + 10,
                    radius: Math.random() * 5 + 2,
                    speed: Math.random() * 0.8 + 0.4,
                    wobbleSpeed: Math.random() * 0.04 + 0.02,
                    wobbleAmp: Math.random() * 1.2 + 0.4,
                    wobbleAngle: Math.random() * Math.PI * 2,
                    opacity: Math.random() * 0.3 + 0.15,
                    color: Math.random() > 0.4 ? '168, 85, 247' : '236, 72, 153'
                };
            }

            for (let i = 0; i < numBubbles; i++) {
                bubbles.push(createBubble(true));
            }

            function animateBubbles() {
                ctx.clearRect(0, 0, width, height);

                bubbles.forEach(b => {
                    b.y -= b.speed;
                    b.wobbleAngle += b.wobbleSpeed;
                    b.x += Math.sin(b.wobbleAngle) * b.wobbleAmp * 0.5;

                    ctx.beginPath();
                    ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(${b.color}, ${b.opacity * 0.3})`;
                    ctx.fill();

                    ctx.strokeStyle = `rgba(255, 255, 255, ${b.opacity * 0.5})`;
                    ctx.lineWidth = 0.8;
                    ctx.stroke();

                    if (b.y < -20) {
                        Object.assign(b, createBubble(false));
                    }
                });

                requestAnimationFrame(animateBubbles);
            }

            animateBubbles();
        });

        function copyToClipboard() {
            var dummy = document.createElement('input');
            document.body.appendChild(dummy);
            dummy.value = window.location.href;
            dummy.select();
            document.execCommand('copy');
            document.body.removeChild(dummy);

            var toast = document.getElementById('toast');
            toast.classList.remove('translate-y-12', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            var copyText = document.getElementById('copy-text');
            copyText.textContent = '¡Copiado!';

            setTimeout(function() {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-12', 'opacity-0');
                copyText.textContent = 'Copiar Enlace';
            }, 2200);
        }
    </script>
