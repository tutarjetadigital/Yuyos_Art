    <style>
        * {
            box-sizing: border-box;
        }
        html, body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            width: 100%;
            font-family: 'Inter', sans-serif;
            background-color: #080714;
            background: radial-gradient(circle at top, #241445 0%, #0d0a1c 55%, #040308 100%) !important;
            color: #f8fafc;
            overflow-x: hidden;
        }

        /* Background Canvas */
        #bubbleCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 1;
        }

        main {
            position: relative;
            z-index: 10;
        }

        .banner-clip {
            clip-path: polygon(0 0, 100% 0, 100% 88%, 0 100%);
        }

        /* Playful Floating Animation */
        @keyframes subtle-float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-6px) rotate(1deg); }
        }

        .animate-float {
            animation: subtle-float 4s ease-in-out infinite;
        }

        @keyframes pulse-glow {
            0%, 100% { opacity: 0.5; transform: scale(1); }
            50% { opacity: 0.85; transform: scale(1.03); }
        }

        .pulse-aura {
            animation: pulse-glow 3s infinite ease-in-out;
        }

        /* Interactive buttons with soft bounce */
        .playful-link {
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            background: rgba(26, 21, 48, 0.7);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .playful-link:hover, .playful-link:active {
            transform: translateY(-4px) scale(1.02);
            background: rgba(45, 33, 84, 0.85);
            border-color: rgba(192, 132, 252, 0.6);
            box-shadow: 0 12px 25px -5px rgba(168, 85, 247, 0.4);

        .twitch-card-btn {
            background: linear-gradient(135deg, rgba(147, 51, 234, 0.35) 0%, rgba(219, 39, 119, 0.35) 100%);
            border: 1.5px solid rgba(216, 180, 254, 0.4);
            backdrop-filter: blur(14px);

            transform: translateY(-3px) scale(1.01);
        }

        }
        .no-scrollbar {
            -ms-overflow-style: none;

        }
    </style>

    <script>
        // Email Copy Function
        function copyEmail() {
            const email = "yuyosart.contact@gmail.com";
            
            // Fallback clipboard method
            const dummy = document.createElement("textarea");
            document.body.appendChild(dummy);
            dummy.value = email;
            dummy.select();
            document.execCommand("copy");
            document.body.removeChild(dummy);

            // UI Feedback
            const toast = document.getElementById("toast");
            const btnText = document.getElementById("copyBtnText");
            
            if (btnText) btnText.textContent = "Copied! ✓";
            
            if (toast) {
                toast.classList.remove("opacity-0");
                toast.classList.add("opacity-100");
                
                setTimeout(() => {
                    toast.classList.remove("opacity-100");
                    toast.classList.add("opacity-0");
                    if (btnText) btnText.textContent = "Copy Email";
                }, 2500);
            }
        }

        // Ambient Soda Bubbles Canvas Effect
        const canvas = document.getElementById('bubbleCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Bubble {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height + Math.random() * 20;
                this.radius = Math.random() * 2.5 + 0.5;
                this.speed = Math.random() * 0.8 + 0.3;
                this.opacity = Math.random() * 0.5 + 0.1;
                this.swing = Math.random() * 0.02 - 0.01;
                this.swingAngle = Math.random() * Math.PI * 2;
            }

            update() {
                this.y -= this.speed;
                this.swingAngle += 0.03;
                this.x += Math.sin(this.swingAngle) * 0.4;

                if (this.y < -10) {
                    this.reset();
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(216, 180, 254, ${this.opacity})`;
                ctx.fill();
            }
        }

        const bubbles = Array.from({ length: 45 }, () => new Bubble());

        function animateBubbles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            bubbles.forEach(bubble => {
                bubble.update();
                bubble.draw();
            });
            requestAnimationFrame(animateBubbles);
        }

        window.onload = function() {
            animateBubbles();
        };
    </script>
