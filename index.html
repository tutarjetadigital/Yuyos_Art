    <!-- Google Fonts Inter & Outfit -->

    <style>
        * {
            box-sizing: border-box;
        }
        html, body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            width: 100%;
            font-family: 'Inter', sans-serif;
            background-color: #080714;
            background: radial-gradient(circle at top, #241445 0%, #0d0a1c 55%, #040308 100%) !important;
            color: #f8fafc;
            overflow-x: hidden;
        }

        /* Canvas de fondo */
        #bubbleCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 1;
        }

        main {
            position: relative;
            z-index: 10;
        }

        .banner-clip {
            clip-path: polygon(0 0, 100% 0, 100% 88%, 0 100%);
        }

        /* Animación flotante juguetona */
        @keyframes subtle-float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-6px) rotate(1deg); }
        }

        .animate-float {
            animation: subtle-float 4s ease-in-out infinite;
        }

        @keyframes pulse-glow {
            0%, 100% { opacity: 0.5; transform: scale(1); }
            50% { opacity: 0.85; transform: scale(1.03); }
        }

        .pulse-aura {
            animation: pulse-glow 3s infinite ease-in-out;
        }

        /* Botones interactivos con rebote suave */
        .playful-link {
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            background: rgba(26, 21, 48, 0.7);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .playful-link:hover, .playful-link:active {
            transform: translateY(-4px) scale(1.02);
            background: rgba(45, 33, 84, 0.85);
            border-color: rgba(192, 132, 252, 0.6);
            box-shadow: 0 12px 25px -5px rgba(168, 85, 247, 0.4);
        }

        .twitch-card-btn {
            background: linear-gradient(135deg, rgba(147, 51, 234, 0.35) 0%, rgba(219, 39, 119, 0.35) 100%);
            border: 1.5px solid rgba(216, 180, 254, 0.4);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .twitch-card-btn:hover, .twitch-card-btn:active {

            box-shadow: 0 14px 30px -5px rgba(192, 132, 252, 0.5);
            transform: translateY(-3px) scale(1.01);
        }

        /* Ocultar scrollbar */
        .no-scrollbar::-webkit-scrollbar {

        }
        .no-scrollbar {

            scrollbar-width: none;
        }
    </style>

    <script>
        // Animación de burbujas flotantes de soda en segundo plano
        window.addEventListener('DOMContentLoaded', () => {
            const canvas = document.getElementById('bubbleCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');

            let width = canvas.width = window.innerWidth;
            let height = canvas.height = window.innerHeight;

            window.addEventListener('resize', () => {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            });

            const bubbles = [];
            const numBubbles = 35;

            function createBubble(initial = false) {
                return {
                    x: Math.random() * width,
                    y: initial ? Math.random() * height : height + Math.random() * 30 + 10,
                    radius: Math.random() * 5.5 + 2,
                    speed: Math.random() * 0.8 + 0.35,
                    wobbleSpeed: Math.random() * 0.035 + 0.015,
                    wobbleAmp: Math.random() * 1.4 + 0.4,
                    wobbleAngle: Math.random() * Math.PI * 2,
                    opacity: Math.random() * 0.35 + 0.15,
                    color: Math.random() > 0.45 ? '192, 132, 252' : '244, 114, 182'
                };
            }

            for (let i = 0; i < numBubbles; i++) {
                bubbles.push(createBubble(true));
            }

            function animateBubbles() {
                ctx.clearRect(0, 0, width, height);

                bubbles.forEach(b => {
                    b.y -= b.speed;
                    b.wobbleAngle += b.wobbleSpeed;
                    b.x += Math.sin(b.wobbleAngle) * b.wobbleAmp * 0.5;

                    ctx.beginPath();
                    ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(${b.color}, ${b.opacity * 0.4})`;
                    ctx.fill();

                    ctx.strokeStyle = `rgba(255, 255, 255, ${b.opacity * 0.6})`;
                    ctx.lineWidth = 0.9;
                    ctx.stroke();

                    if (b.y < -20) {
                        Object.assign(b, createBubble(false));
                    }
                });

                requestAnimationFrame(animateBubbles);
            }

            animateBubbles();
        });

        function showToast(message, icon = '✨') {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-msg');
            const toastIcon = document.getElementById('toast-icon');

            toastMsg.textContent = message;
            toastIcon.textContent = icon;

            toast.classList.remove('translate-y-12', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-12', 'opacity-0');
            }, 2300);
        }

        function copyEmail() {
            const email = 'yuyosart.business@gmail.com';
            const dummy = document.createElement('input');
            document.body.appendChild(dummy);
            dummy.value = email;
            dummy.select();
            document.execCommand('copy');
            document.body.removeChild(dummy);

            showToast('¡Email copiado a tu portapapeles!', '📬');
        }

        function copyToClipboard() {
            const dummy = document.createElement('input');
            document.body.appendChild(dummy);
            dummy.value = window.location.href;
            dummy.select();
            document.execCommand('copy');
            document.body.removeChild(dummy);

            showToast('¡Enlace copiado con éxito!', '🚀');
        }
    </script>
